name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Los datos simulados son reproducibles
        run: npm run datos:simular && git diff --exit-code public/data
      - name: JSON válidos
        run: for f in public/data/*.json public/data/*/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f'))" || exit 1; done
      - run: npm test
      - run: npm run build
